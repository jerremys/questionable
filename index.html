<!DOCTYPE html>
<html manifest="cache.manifest" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionable</title>
    <link rel="stylesheet" href="index.css">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

<body>

        <div id="generate" class="logo">&#x21bb;</div>

            <span class="slice"></span>

        <div class="rule"></div>

        <p class="body-text">
            <a id="source-link" href="https://heatherholleman.com/wp-content/uploads/2022/10/The-Six-Conversations-100-Questions.pdf" target="_blank" class="copyright"></a>

    <script src="questions.js"></script>
    <script src="index.js"></script>

</html>
